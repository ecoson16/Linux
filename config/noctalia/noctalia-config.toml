[bar.default]
capsule_group = []
center = [ "notes", "clock", "bar" ]
end = [ "notifications", "tray", "clipboard", "bluetooth", "volume", "brightness", "network", "battery" ]
reserve_space = false
smart_auto_hide = true
start = [ "session", "control-center", "launcher", "media", "cat" ]
thickness = 24

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
icon_size = 32
launcher_position = "start"
pinned = [ "xfce4-terminal" ]
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]
pre_action_fade_seconds = 0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 1800.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 3600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 900.0

[location]
auto_locate = true

[lockscreen_widgets]
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 683.0
    cy = 586.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[notification]
position = "bottom_right"

[osd]
enabled = false

[plugin_settings."radimous/prismlauncher-instances"]
launcher_exec_command = "flatpak run org.prismlauncher.PrismLauncher"
prism_path = "~/.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher/"

[plugins]
enabled = [ "noctalia/world_clock", "dotnetrob/cat", "noctalia/notes" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
font_family = "JetBrainsMono Nerd Font"
screen_time_enabled = true
time_format = "{:%-I:%M %p}"

    [shell.screenshot]
    directory = "/home/ecoson16/Pictures/Screenshots"
    show_cursor = true

[theme]
builtin = "Catppuccin"
community_palette = "GitHub Dark"
mode = "dark"
pure_black_dark = true
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt" ]
    community_ids = [ "discord", "vscode", "prismlauncher", "fastfetch", "thunderbird", "papirus-icons" ]

[wallpaper]
directory = "/home/ecoson16/Pictures/Wallpapers"
fill_mode = "fit"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/ecoson16/Pictures/Wallpapers/clouds-3.png"

    [wallpaper.last]
    path = "/home/ecoson16/Pictures/Wallpapers/clouds-3.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/ecoson16/Pictures/Wallpapers/clouds-3.png"

[widget.bar]
type = "noctalia/world_clock:bar"

[widget.cat]
type = "dotnetrob/cat:cat"

[widget.clock]
format = "{:%-I:%M %p}"

[widget.notes]
type = "noctalia/notes:notes"

[widget.tray]
hidden = [
    "networkmanager",
    "network-manager-applet",
    "nm-connection-editor",
    "networkmanager-vpn-plugin-openvpn",
    "networkmanager-openvpn"
]
